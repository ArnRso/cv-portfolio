name: Vérification

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      # Mêmes étapes qu'en local (npm run verify) : une seule définition
      # des vérifications, dans scripts/verify.mjs.
      - name: Vérifier
        run: npm run verify
